<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3f4f6"><title>CTR Brașov</title><style>:root{--g:#159447;--r:#d9363e;--m:#6b7280}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{touch-action:manipulation}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:10px 14px 14px;color:#111}.w{max-width:560px;margin:auto}h1{text-align:center;margin:4px 0 0;font-size:27px}.sub{text-align:center;color:var(--m);font-size:13px;margin:2px 0 10px}.sec{margin:9px 4px 4px;font-size:12px;font-weight:800;color:var(--m);text-transform:uppercase}.z{background:#fff;border-radius:14px;padding:9px 12px;margin:6px 0;display:flex;align-items:center;justify-content:space-between;min-height:52px;box-shadow:0 1px 4px #0001}.n{font-size:18px;font-weight:800}.s{min-width:132px;border:0;border-radius:11px;padding:9px 10px;color:#fff;font-weight:900;font-size:14px;cursor:pointer;touch-action:manipulation;user-select:none}.open{background:var(--g)}.closed{background:var(--r)}.info{background:#fff;border-radius:14px;padding:10px 12px;margin-top:9px;text-align:center}.sun{font-size:19px;font-weight:900}.date,.updated,.note{color:var(--m);font-size:12px;margin-top:4px}.wa{display:block;width:100%;border:0;background:#1fa855;color:#fff;text-align:center;border-radius:14px;padding:12px;margin-top:9px;font-size:16px;font-weight:900;cursor:pointer;touch-action:manipulation}.wa:disabled{opacity:.6}.err{color:#b42318}@media(max-height:740px){body{padding-top:6px}.z{min-height:46px;padding:7px 11px;margin:5px 0}.sec{margin-top:7px}.info{padding:8px 10px}.wa{padding:10px}}</style></head><body><div class="w"><h1>🛩️ CTR BRAȘOV</h1><div class="sub">Status zone de zbor</div><div class="sec">AZLR</div><div class="z"><span class="n">AZLR1</span><button class="s closed" data-zone="AZLR1">🔴 ÎNCHIS</button></div><div class="z"><span class="n">AZLR2</span><button class="s closed" data-zone="AZLR2">🔴 ÎNCHIS</button></div><div class="z"><span class="n">AZLR3</span><button class="s closed" data-zone="AZLR3">🔴 ÎNCHIS</button></div><div class="sec">Deal - Vale</div><div class="z"><span class="n">DV Bunloc</span><button class="s closed" data-zone="DV Bunloc">🔴 ÎNCHIS</button></div><div class="z"><span class="n">DV Postăvaru</span><button class="s closed" data-zone="DV Postăvaru">🔴 ÎNCHIS</button></div><div class="z"><span class="n">DV Lempeș</span><button class="s closed" data-zone="DV Lempeș">🔴 ÎNCHIS</button></div><div class="info"><div class="sun">🌅 Apus astăzi: <span id="sunset">--:--</span></div><div class="date" id="date"></div><div class="updated" id="updated">Se încarcă statusul comun...</div></div><button class="wa" id="wa">💾 Salvează și trimite pe WhatsApp</button><div class="note">Modificările devin comune pentru toți numai după apăsarea butonului verde.</div></div><script>const DB='https://ctr-brasov-default-rtdb.europe-west1.firebasedatabase.app',LAT=45.6579,LON=25.6012;const bs=[...document.querySelectorAll('.s')],se=document.getElementById('sunset'),de=document.getElementById('date'),up=document.getElementById('updated'),wa=document.getElementById('wa');function rad(d){return d*Math.PI/180}function deg(r){return r*180/Math.PI}function n360(x){x%=360;return x<0?x+360:x}function n24(x){x%=24;return x<0?x+24:x}function sunset(d,lat,lon){const st=new Date(d.getFullYear(),0,0),N=Math.floor((d-st)/86400000),lh=lon/15,t=N+(18-lh)/24,M=.9856*t-3.289;let L=n360(M+1.916*Math.sin(rad(M))+.020*Math.sin(rad(2*M))+282.634),RA=n360(deg(Math.atan(.91764*Math.tan(rad(L)))));RA+=Math.floor(L/90)*90-Math.floor(RA/90)*90;RA/=15;const sd=.39782*Math.sin(rad(L)),cd=Math.cos(Math.asin(sd)),cH=(Math.cos(rad(90.833))-sd*Math.sin(rad(lat)))/(cd*Math.cos(rad(lat)));if(cH>1||cH<-1)return null;const H=deg(Math.acos(cH))/15,T=H+RA-.06571*t-6.622,UT=n24(T-lh),u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));u.setUTCMinutes(Math.round(UT*60));return u}const now=new Date(),ss=sunset(now,LAT,LON);de.textContent=now.toLocaleDateString('ro-RO',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});if(ss)se.textContent=ss.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Bucharest'});function paint(b,o){b.dataset.open=o?'1':'0';b.className='s '+(o?'open':'closed');b.textContent=o?'🟢 DESCHIS':'🔴 ÎNCHIS'}function payload(){const zones={};bs.forEach(b=>zones[b.dataset.zone]=b.dataset.open==='1');return{zones,updatedAt:Date.now()}}function formatUpdated(ms){if(!ms)return 'Status comun încă nesalvat.';return 'Ultima actualizare: '+new Date(ms).toLocaleString('ro-RO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}function message(){let a=['🛩️ *CTR BRAȘOV – STATUS ZONE*',''];bs.forEach(b=>{const o=b.dataset.open==='1';a.push((o?'🟢 ':'🔴 ')+b.dataset.zone+' — '+(o?'DESCHIS':'ÎNCHIS'))});a.push('','🌅 Apus astăzi: '+se.textContent);return a.join('\n')}bs.forEach(b=>b.onclick=()=>paint(b,b.dataset.open!=='1'));async function load(){try{const r=await fetch(DB+'/status.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d&&d.zones){bs.forEach(b=>paint(b,d.zones[b.dataset.zone]===true));up.textContent=formatUpdated(d.updatedAt)}else{bs.forEach(b=>paint(b,false));up.textContent='Prima utilizare: selectează zonele și salvează.'}}catch(e){up.textContent='Nu pot încărca statusul comun.';up.classList.add('err')}}wa.onclick=async()=>{wa.disabled=true;wa.textContent='⏳ Se salvează...';try{const p=payload();const r=await fetch(DB+'/status.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});if(!r.ok)throw new Error('HTTP '+r.status);up.classList.remove('err');up.textContent=formatUpdated(p.updatedAt);const url='https://wa.me/?text='+encodeURIComponent(message());wa.textContent='✅ Salvat';setTimeout(()=>{wa.disabled=false;wa.textContent='💾 Salvează și trimite pe WhatsApp'},1200);window.location.href=url}catch(e){wa.disabled=false;wa.textContent='💾 Salvează și trimite pe WhatsApp';up.textContent='Eroare la salvare. Încearcă din nou.';up.classList.add('err')}};load()</script></body></html>
