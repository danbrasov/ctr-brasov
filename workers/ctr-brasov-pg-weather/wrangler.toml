name = "ctr-brasov-pg-weather"
main = "src/index.js"
compatibility_date = "2026-10-05"

[triggers]
crons = ["*/15 * * * *"]

# D1 binding used by /collect and /history.
# Add the existing Cloudflare D1 database_id before enabling GitHub deployment.
[[d1_databases]]
binding = "DB"
database_name = "ctr-brasov-weather"
database_id = "a27c96f1-bb4d-473a-8f37-90eaba411fc7"

[[secrets_store_secrets]]
binding = "XPANDER_AUTH"
store_id = "c288ca8ddf0a433499e9c36666f0e74f"
secret_name = "xpander_auth"

