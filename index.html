<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CTR Brașov</title><style>:root{--g:#159447;--r:#d9363e;--m:#6b7280}*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:20px;color:#111}.w{max-width:620px;margin:auto}h1{text-align:center;margin:20px 0 3px;font-size:32px}.sub{text-align:center;color:var(--m);margin-bottom:22px}.sec{margin:18px 4px 8px;font-size:14px;font-weight:800;color:var(--m);text-transform:uppercase}.z{background:#fff;border-radius:18px;padding:16px 18px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 5px #0001}.n{font-size:22px;font-weight:800}.s{min-width:150px;border:0;border-radius:14px;padding:12px;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.open{background:var(--g)}.closed{background:var(--r)}.info{background:#fff;border-radius:18px;padding:18px;margin-top:18px;text-align:center}.sun{font-size:23px;font-weight:900}.date,.updated,.note{color:var(--m);font-size:14px;margin-top:8px}.wa{display:block;background:#1fa855;color:#fff;text-decoration:none;text-align:center;border-radius:18px;padding:17px;margin-top:16px;font-size:18px;font-weight:900}</style></head><body><div class="w"><h1>🛩️ CTR BRAȘOV</h1><div class="sub">Status zone de zbor</div><div class="sec">AZLR</div><div class="z"><span class="n">AZLR1</span><button class="s closed" data-zone="AZLR1">🔴 ÎNCHIS</button></div><div class="z"><span class="n">AZLR2</span><button class="s closed" data-zone="AZLR2">🔴 ÎNCHIS</button></div><div class="z"><span class="n">AZLR3</span><button class="s closed" data-zone="AZLR3">🔴 ÎNCHIS</button></div><div class="sec">Deal - Vale</div><div class="z"><span class="n">DV Bunloc</span><button class="s closed" data-zone="DV Bunloc">🔴 ÎNCHIS</button></div><div class="z"><span class="n">DV Postăvaru</span><button class="s closed" data-zone="DV Postăvaru">🔴 ÎNCHIS</button></div><div class="z"><span class="n">DV Lempeș</span><button class="s closed" data-zone="DV Lempeș">🔴 ÎNCHIS</button></div><div class="info"><div class="sun">🌅 Apus astăzi: <span id="sunset">--:--</span></div><div class="date" id="date"></div><div class="updated" id="updated">Apasă pe o zonă pentru DESCHIS / ÎNCHIS.</div></div><a class="wa" id="wa" href="#">💬 Trimite status pe WhatsApp</a><div class="note">Momentan statusul se salvează pe dispozitivul pe care îl modifici.</div></div><script>const LAT=45.6579,LON=25.6012,K='ctr-brasov-v1';function rad(d){return d*Math.PI/180}function deg(r){return r*180/Math.PI}function n360(x){x%=360;return x<0?x+360:x}function n24(x){x%=24;return x<0?x+24:x}function sunset(d,lat,lon){const st=new Date(d.getFullYear(),0,0),N=Math.floor((d-st)/86400000),lh=lon/15,t=N+(18-lh)/24,M=.9856*t-3.289;let L=n360(M+1.916*Math.sin(rad(M))+.020*Math.sin(rad(2*M))+282.634),RA=n360(deg(Math.atan(.91764*Math.tan(rad(L)))));RA+=(Math.floor(L/90)*90-Math.floor(RA/90)*90);RA/=15;const sd=.39782*Math.sin(rad(L)),cd=Math.cos(Math.asin(sd)),cH=(Math.cos(rad(90.833))-sd*Math.sin(rad(lat)))/(cd*Math.cos(rad(lat)));if(cH>1||cH<-1)return null;const H=deg(Math.acos(cH))/15,T=H+RA-.06571*t-6.622,UT=n24(T-lh),u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));u.setUTCMinutes(Math.round(UT*60));return u}const now=new Date(),ss=sunset(now,LAT,LON),se=document.getElementById('sunset'),de=document.getElementById('date'),up=document.getElementById('updated'),wa=document.getElementById('wa'),bs=[...document.querySelectorAll('.s')];de.textContent=now.toLocaleDateString('ro-RO',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});if(ss)se.textContent=ss.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Bucharest'});let state={};try{state=JSON.parse(localStorage.getItem(K))||{}}catch(e){}function paint(b,o){b.dataset.open=o?'1':'0';b.className='s '+(o?'open':'closed');b.textContent=o?'🟢 DESCHIS':'🔴 ÎNCHIS'}function msg(){let a=['🛩️ *CTR BRAȘOV – STATUS ZONE*',''];bs.forEach(b=>{let o=b.dataset.open==='1';a.push((o?'🟢 ':'🔴 ')+b.dataset.zone+' — '+(o?'DESCHIS':'ÎNCHIS'))});a.push('','🌅 Apus astăzi: '+se.textContent);wa.href='https://wa.me/?text='+encodeURIComponent(a.join('\n'))}bs.forEach(b=>{paint(b,state[b.dataset.zone]===true);b.onclick=()=>{let o=b.dataset.open!=='1';paint(b,o);state[b.dataset.zone]=o;localStorage.setItem(K,JSON.stringify(state));up.textContent='Ultima modificare: '+new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});msg()}});msg()</script></body></html>
