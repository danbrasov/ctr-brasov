<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test NOTAM Brașov</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f4f6;margin:0;padding:18px;color:#111}main{max-width:560px;margin:auto}h1{text-align:center;font-size:24px;margin:4px 0 6px}.sub{text-align:center;color:#6b7280;margin-bottom:14px}.card{background:#fff;border-radius:14px;padding:14px;margin:8px 0;box-shadow:0 1px 4px #0001;display:flex;justify-content:space-between;align-items:center}.zone{font-size:19px;font-weight:800}.notam{text-align:right;font-weight:800}.lim{font-size:12px;color:#6b7280;margin-top:3px}.info{background:#fff;border-radius:14px;padding:12px;margin-top:12px;text-align:center;color:#6b7280;font-size:13px}.warn{margin-top:10px;font-size:12px;color:#6b7280;text-align:center}.bad{color:#b42318}</style></head><body><main><h1>🧪 TEST NOTAM BRAȘOV</h1><div class="sub">Prototip separat — aplicația CTR nu este modificată</div><div id="cards"></div><div class="info" id="info">Se încarcă datele automate…</div><div class="warn">⚠️ Pagină de test. Verifică NOTAM-ul în sursa oficială ROMATSA înainte de utilizare operațională.</div></main><script>const cfg={AZLR1:"GND – FL090",AZLR2:"GND – FL060",AZLR3:"GND – FL050"},cards=document.getElementById("cards"),info=document.getElementById("info");function draw(d){cards.innerHTML="";Object.keys(cfg).forEach(z=>{const x=d?.zones?.[z],n=x?.notam||"—";cards.insertAdjacentHTML("beforeend",'<div class="card"><div class="zone">'+z+'</div><div class="notam '+(n==="—"?"bad":"")+'">'+n+'<div class="lim">'+cfg[z]+'</div></div></div>')});const t=d?.checkedAt?new Date(d.checkedAt).toLocaleString("ro-RO",{timeZone:"Europe/Bucharest"}):"—";info.innerHTML="Ultima verificare automată: <b>"+t+"</b><br>Sursa: ROMATSA TWR LRBV"}fetch("notam-data.json?ts="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(draw).catch(()=>{draw(null);info.innerHTML='<span class="bad">Datele automate nu sunt încă disponibile.</span>'})</script></body></html>
