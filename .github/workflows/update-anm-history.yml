name: Update ANM weather history
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update ANM history
        run: python3 scripts/update_anm_history.py anm-history.json
      - name: Commit changed history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anm-history.json
          git diff --cached --quiet || git commit -m "Update ANM weather history"
          git push
