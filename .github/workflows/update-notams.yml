name: Update NOTAM test data
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ROMATSA NOTAMs
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            --ciphers 'DEFAULT@SECLEVEL=1' \
            --user-agent "Mozilla/5.0 ctr-brasov-notam-check/1.0" \
            "https://flightplan.romatsa.ro/init/notam/getnotamlist?twr=LRBV" \
            -o /tmp/romatsa.html
          python3 scripts/parse_notams.py /tmp/romatsa.html notam-data.json
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notam-data.json
          git diff --cached --quiet || git commit -m "Update NOTAM test data"
          git push
