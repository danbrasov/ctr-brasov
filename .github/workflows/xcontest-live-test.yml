name: XContest Live test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install ws@8 --no-save --no-package-lock
      - name: Read XContest Live for 15 seconds
        run: node scripts/xcontest_live_test.mjs
      - name: Save test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xcontest-test.json
          git diff --cached --quiet || git commit -m "Update XContest Live test data"
          git push
